# PhysioPath — Portainer Stack / Docker Compose
# Deploy: pull the image and recreate the container (no Watchtower).
#   docker pull ghcr.io/christopherstainberg-oss/physiopath:latest
#   then recreate physiopath with the same -p 8035:80 and --env XAI_API_KEY
#
# The image is published to GHCR by the repo's "Publish Docker image to GHCR"
# workflow on every push to main.
services:
  physiopath:
    image: ghcr.io/christopherstainberg-oss/physiopath:latest
    container_name: physiopath
    ports:
      - "8080:80"          # host:container — this host maps 8035:80 at run time
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
