# Client Authorization wins; otherwise inject XAI_API_KEY (envsubst at container start).
map $http_authorization $xai_auth {
    ""        "Bearer ${XAI_API_KEY}";
    default   $http_authorization;
}

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip static assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "no-referrer" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;
    # Allow browser → Open WebUI (or any http/https LLM host). Do not pin to Anthropic —
    # Jeffery talks to the user's Open WebUI base URL from the browser.
    add_header Content-Security-Policy "connect-src 'self' http: https: data: blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Same-origin Grok proxy (key from XAI_API_KEY at container start — never in the PWA).
    location /xai/ {
        resolver 1.1.1.1 ipv6=off valid=300s;
        proxy_pass https://api.x.ai/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.x.ai;
        proxy_set_header Authorization $xai_auth;
        proxy_read_timeout 120s;
    }

    # service worker must always revalidate so updates roll out
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # correct MIME type for the PWA manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # data + code + icons — cacheable
    location ~* \.(?:js|css|png|svg|ico|json)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
